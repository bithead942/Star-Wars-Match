<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Wars Match</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="light">
  <div class="app">
    <header class="top-bar">
      <div class="stats" aria-live="polite">
        <div class="stat"><span>Time</span><strong id="timer">0:00</strong></div>
        <div class="stat"><span>Rounds</span><strong id="rounds">0</strong></div>
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      </div>
      <img src="img/Star%20Wars%20Match.png" alt="Star Wars Match" class="title-img" />
      <button class="settings-btn" id="settingsBtn" aria-label="Settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="currentColor"/>
          <path d="M19.4 13a2 2 0 0 0 .2 1.4l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-1.4-.2 2 2 0 0 0-1.4.8V19a2 2 0 1 1-4 0v-.2a2 2 0 0 0-1.4-.8 2 2 0 0 0-1.4.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a2 2 0 0 0 .2-1.4 2 2 0 0 0-.8-1.4H4a2 2 0 1 1 0-4h.2a2 2 0 0 0 .8-1.4 2 2 0 0 0-.2-1.4l-.1-.1A2 2 0 1 1 7.7 4.3l.1.1a2 2 0 0 0 1.4.2 2 2 0 0 0 1.4-.8V4a2 2 0 1 1 4 0v.2a2 2 0 0 0 1.4.8 2 2 0 0 0 1.4-.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a2 2 0 0 0-.2 1.4 2 2 0 0 0 .8 1.4H20a2 2 0 1 1 0 4h-.2a2 2 0 0 0-.8 1.4 2 2 0 0 0 .2 1.4l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-1.4-.2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <main class="board" id="board" role="list"></main>

    <div id="winOverlay" class="overlay hidden">
      <div class="overlay-card">
        <h2>Galaxy Cleared</h2>
        <p>Time: <span id="winTime">0:00</span></p>
        <p>Rounds: <span id="winRounds">0</span></p>
        <p>Score: <span id="winScore">0</span></p>
        <button id="playAgainBtn" type="button">Play Again</button>
      </div>
    </div>

    <div id="settingsOverlay" class="overlay hidden">
      <div class="overlay-card settings-card">
        <h2>Settings</h2>
        <div class="setting">
          <h3>Difficulty</h3>
          <div class="option-group" id="difficultyGroup">
            <button data-value="easy" type="button" class="option">Easy (6)</button>
            <button data-value="medium" type="button" class="option active">Medium (10)</button>
            <button data-value="hard" type="button" class="option">Hard (14)</button>
          </div>
        </div>
        <div class="setting">
          <h3>Theme</h3>
          <div class="option-group" id="themeGroup">
            <button data-value="light" type="button" class="option active">Light</button>
            <button data-value="dark" type="button" class="option">Dark</button>
          </div>
        </div>
        <div class="setting actions">
          <button id="resetBtn" type="button">Reset Game</button>
          <button id="closeBtn" type="button">Close</button>
          <button id="exitBtn" type="button">Exit</button>
        </div>
      </div>
    </div>

    <div id="startOverlay" class="overlay hidden">
      <div class="overlay-card start-card">
        <h2>Choose Your Theme</h2>
        <div class="start-actions">
          <button id="startLight" type="button" class="start-btn">
            <img src="img/Rebel%20logo.jpg" alt="Light" class="start-img" />
          </button>
          <button id="startDark" type="button" class="start-btn">
            <img src="img/Imperial%20logo.jpg" alt="Dark" class="start-img" />
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
